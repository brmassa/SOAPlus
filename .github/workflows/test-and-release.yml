    release-dry-run:
        name: Release (Dry Run)
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            # Install dependencies
            - name: Install semantic-release and plugins
              run: |
                  npm install -g semantic-release @semantic-release/exec @semantic-release/git

            # Calculate next version
            - name: Calculate next version
              id: version
              run: |
                  semantic-release --dry-run | tee output.txt
                  VERSION=$(grep "The next release version is" output.txt | sed 's/.*version is //')
                  echo "NEXT_VERSION=${VERSION}" >> $GITHUB_ENV
                  echo "Calculated next version: ${VERSION}"

            # This step will actually modify the files
            - name: Update files
              if: env.NEXT_VERSION != ''
              run: |
                  echo "Updating files for version: ${NEXT_VERSION}"
                  node scripts/update-files.js "${NEXT_VERSION}" "Test release notes"

            # Show changes
            - name: Show changes
              run: |
                  echo "Modified files:"
                  git status

                  echo -e "\nChanges in package.json files:"
                  git diff **/package.json

                  echo -e "\nChanges in CHANGELOG.md files:"
                  git diff **/CHANGELOG.md

    release:
        # needs: test
        name: Release
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Semantic Release
              uses: cycjimmy/semantic-release-action@v4
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  extra_plugins: |
                      @semantic-release/exec
                      @semantic-release/git

            - name: Update Package Versions
              run: |
                  VERSION=${GITHUB_REF#refs/tags/v}
                  find . -name "package.json" -type f -exec sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" {} \;

            - name: Commit Updated Versions
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                  commit_message: "chore: update package versions to ${{ env.VERSION }}"
                  file_pattern: "**/package.json"
